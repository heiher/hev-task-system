name: "Check code formatting"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Prepare
        run: |
          pip install --user "clang-format==21.1.*"
      - name: Format
        run: |
          find apps benches include src tests -iname "*.[h,c]" -exec clang-format -i {} \;
          git checkout src/arch/arm/asm.h src/arch/x86/asm.h
      - name: Check
        run: |
          git status
          git diff --quiet
